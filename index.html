:root{

  letter-spacing:-0.01em;line-height:1;
}
.header-badge{
  font-size:11px;font-weight:500;letter-spacing:0.06em;
  text-transform:uppercase;color:var(--hint);
}

/* ── Main layout ── */
main{
  position:relative;z-index:1;flex:1;padding:40px 28px;
  padding-bottom:calc(var(--safe-bottom) + 32px);
  max-width:640px;margin:0 auto;width:100%;
}
.hero{margin-bottom:44px;text-align:center;}

.hero-eyebrow{
  font-size:11px;font-weight:600;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--hint);margin-bottom:8px;text-align:center;
}
.hero-title{
  font-family:'Inter',system-ui,sans-serif;
  font-size:30px;font-weight:300;line-height:1.1;
  letter-spacing:-0.03em;color:var(--text);margin-bottom:0;
}
.hero-title em{font-style:italic;}
.hero-sub{font-size:15px;color:#f7f0e6;line-height:1.6;max-width:440px;margin:12px auto 0;}

/* ── Input section ── */
.input-section{margin-bottom:0;}
.input-label{
  font-size:11px;font-weight:600;letter-spacing:0.08em;
  text-transform:uppercase;color:rgba(247,240,230,0.4);
  margin-bottom:10px;display:block;
}
.url-row{display:flex;gap:8px;margin-bottom:8px;}
.url-row:last-of-type{margin-bottom:0;}
.url-input{
  flex:1;background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  padding:13px 15px;
  font-family:inherit;font-size:15px;color:var(--text);
  outline:none;transition:border-color 0.15s,box-shadow 0.15s;
  min-width:0;-webkit-appearance:none;
}
.url-input::placeholder{color:rgba(255,255,255,0.3);}
.url-input:focus{border-color:var(--text);box-shadow:0 0 0 3px rgba(0,0,0,0.05);}
.icon-btn{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius-sm);width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--muted);font-size:18px;
  flex-shrink:0;-webkit-appearance:none;
}
.icon-btn:active{background:rgba(191,53,48,0.1);color:#bf3530;}


#scan-btn{
  width:100%;padding:15px 20px;
  background:#f7f0e6;color:#000000;border:none;
  border-radius:var(--radius);
  font-family:'Inter',system-ui,sans-serif;
  font-size:16px;font-weight:600;font-style:normal;
  letter-spacing:0.02em;
  cursor:pointer;margin-top:28px;margin-bottom:36px;
  transition:opacity 0.15s,transform 0.1s;
  -webkit-appearance:none;
}
#scan-btn:active{opacity:0.82;transform:scale(0.985);}
#scan-btn:disabled{opacity:0.28;cursor:not-allowed;}

/* ── Status bar ── */
.proxy-bar{
  font-size:12px;color:var(--muted);
  padding:9px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  margin-bottom:16px;display:none;align-items:center;gap:8px;
}
.proxy-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;}
.proxy-dot.trying{background:var(--amber);}
.proxy-dot.fail{background:var(--red);}

/* ── Results ── */
.results-label{
  font-size:11px;font-weight:600;letter-spacing:0.08em;
  text-transform:uppercase;color:var(--hint);margin-bottom:12px;text-align:center;
}
/* ── Results area — cream bg, green text ── */
#results-wrap{
  background:#f7f0e6;
  border-radius:20px;
  padding:20px 0 8px;
  margin:0 -4px;
}
#results-wrap .results-label{ color:#1a1a1a; }
#results-wrap .site-card{
  background:#faf7f2;
  border-color:rgba(26,26,26,0.06);
}
#results-wrap .site-card-url{ color:#1a1a1a; }
#results-wrap .site-card-header:active{ background:rgba(26,26,26,0.06); }
#results-wrap .site-card-chevron{ color:rgba(26,26,26,0.3); }
#results-wrap .site-card-body{ border-top-color:rgba(26,26,26,0.1); }
#results-wrap .tab-strip{ background:rgba(26,26,26,0.05); border-bottom-color:rgba(26,26,26,0.1); }
#results-wrap .tab{ color:#1a1a1a; }
#results-wrap .tab.active{ color:#1a1a1a; border-bottom-color:#1a1a1a; background:transparent; }
#results-wrap .tab-panel{ color:#1a1a1a; }
#results-wrap .crawl-info{ background:transparent; color:#666660; border-bottom-color:rgba(26,26,26,0.08); }
#results-wrap .issue-row{ border-bottom-color:rgba(26,26,26,0.1); }
#results-wrap .issue-glyph{ color:#1a1a1a; }
#results-wrap .issue-why{ color:#666660; }
#results-wrap .issue-fix{ color:#1a6e3c; }
#results-wrap .summary-text{ color:#1a1a1a; border-bottom-color:rgba(26,26,26,0.08); }
#results-wrap .link-row{ border-bottom-color:rgba(26,26,26,0.1); }
#results-wrap .link-href{ color:#1a1a1a; }
#results-wrap .img-row{ border-bottom-color:rgba(26,26,26,0.1); }
#results-wrap .img-name{ color:#1a1a1a; }
#results-wrap .img-dim{ color:#666660; }
#results-wrap .state-mute{ color:#666660; }
#results-wrap .state-ok{ color:#1a6e3c; }
#results-wrap .state-err{ color:#bf3530; }
#results-wrap .loading-row{ color:#666660; }
#results-wrap .spinner{ border-color:rgba(26,26,26,0.15); border-top-color:#1a1a1a; }
#results-wrap .pdf-subcard{ background:rgba(26,26,26,0.05); border-color:rgba(26,26,26,0.1); }
#results-wrap .pdf-subcard-header:active{ background:rgba(26,26,26,0.06); }
#results-wrap .pdf-filename{ color:#1a1a1a; }
#results-wrap .pdf-chevron{ color:rgba(26,26,26,0.4); }
#results-wrap .pdf-subcard-body{ border-top-color:rgba(26,26,26,0.1); }
#results-wrap .pdf-icon-glyph{ color:#a05c00; }
#results-wrap .proxy-bar{ background:transparent; border-color:rgba(26,26,26,0.08); color:#666660; }
.site-card{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:12px;overflow:hidden;
}
.site-card-header{
  display:flex;align-items:center;gap:10px;
  padding:18px 20px;cursor:pointer;
  user-select:none;-webkit-user-select:none;
}
.site-card-header:active{background:var(--surface2);}
.site-card-chevron{font-size:10px;color:var(--hint);transition:transform 0.22s;flex-shrink:0;}
.site-card-chevron.open{transform:rotate(90deg);}
.site-card-url{
  flex:1;font-size:13px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  min-width:0;color:var(--text);letter-spacing:-0.01em;
}
.badge-row{display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0;max-width:52%;justify-content:flex-end;}
.badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600;white-space:nowrap;letter-spacing:0.02em;}
.b-ok  {background:#1a6e3c;color:#ffffff;}
.b-warn{background:#e8890a;color:#ffffff;}
.b-err {background:#bf3530;color:#ffffff;}
.b-scan{background:#0055cc;color:#ffffff;}
.b-gray{background:#888;color:#ffffff;}
.b-pdf {background:#e8890a;color:#ffffff;}

.site-card-body{display:none !important;border-top:1.5px solid var(--border);}
.site-card-body.open{display:block !important;}

/* ── Tabs ── */
.tab-strip{
  display:flex;overflow-x:auto;
  border-bottom:1px solid var(--border);
  scrollbar-width:none;background:var(--surface2);
}
.tab-strip::-webkit-scrollbar{display:none;}
.tab{
  padding:11px 16px;font-family:inherit;font-size:12px;
  font-weight:500;color:var(--muted);background:none;border:none;
  border-bottom:2px solid transparent;cursor:pointer;
  white-space:nowrap;flex-shrink:0;-webkit-appearance:none;
  letter-spacing:0.03em;text-transform:uppercase;
}
.tab.active{color:var(--text);border-bottom-color:var(--text);background:var(--surface);}
.tab-panel{display:none !important;padding:20px 20px;}
.tab-panel.active{display:block !important;}
.crawl-info{font-size:11px;color:var(--hint);padding:9px 20px;border-bottom:1px solid var(--border);background:var(--surface2);}

/* ── Issue rows ── */
.issue-row{
  display:flex;gap:12px;padding:16px 0;
  border-bottom:1px solid var(--border);
  font-size:14px;line-height:1.5;
}
.issue-row:last-child{border-bottom:none;padding-bottom:0;}
.issue-glyph{color:var(--hint);flex-shrink:0;margin-top:2px;font-size:11px;width:14px;}
.issue-body{flex:1;min-width:0;}
.issue-orig{
  font-family:'SF Mono','Fira Mono',monospace;font-size:12px;
  background:rgba(191,53,48,0.1);color:#bf3530;
  padding:2px 7px;border-radius:5px;display:inline;word-break:break-word;
}
.issue-fix{font-size:13px;color:var(--green);margin-top:5px;font-weight:600;}
.issue-why{font-size:12px;color:var(--muted);margin-top:3px;}
.page-tag{font-size:10px;color:var(--hint);margin-left:6px;}
.found-on-tag{font-size:10px;color:#1a1a1a;background:rgba(26,26,26,0.08);padding:1px 6px;border-radius:4px;margin-left:6px;font-weight:500;text-decoration:none;display:inline-block;}
.found-on-tag:hover{background:rgba(26,26,26,0.2);}
.issue-sentence{font-size:12px;color:rgba(26,26,26,0.6);font-style:italic;margin:4px 0;line-height:1.5;border-left:2px solid rgba(26,26,26,0.2);padding-left:8px;}
.lang-tag{
  font-size:10px;padding:1px 6px;border-radius:6px;
  background:var(--blue-bg);color:var(--blue);
  margin-left:6px;font-weight:600;letter-spacing:0.02em;
}

/* ── Link rows ── */
.link-row{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;
}
.link-row:last-child{border-bottom:none;}
.link-pill{
  font-size:10px;padding:2px 8px;border-radius:10px;
  font-weight:600;flex-shrink:0;margin-top:1px;letter-spacing:0.03em;
}
.lp-ok    {background:var(--green-bg);color:var(--green);}
.lp-broken{background:var(--red-bg);color:var(--red);}
.lp-unknown{background:var(--surface2);color:var(--muted);}
.link-href{color:var(--muted);word-break:break-all;}
.link-info{flex:1;min-width:0;}
.link-found-on{display:block;font-size:11px;color:var(--hint);margin-top:2px;}

/* ── Image rows ── */
.img-row{
  display:flex;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--border);align-items:flex-start;
}
.img-row:last-child{border-bottom:none;}
.img-thumb{
  width:56px;height:44px;border-radius:8px;object-fit:cover;
  background:var(--surface2);border:1px solid var(--border);
  flex-shrink:0;display:block;
}
.img-info{flex:1;min-width:0;}
.img-name{font-size:12px;color:var(--muted);word-break:break-all;margin-bottom:2px;}
.img-dim{font-size:11px;color:var(--hint);}
.img-verdict{font-size:13px;font-weight:600;margin-top:4px;}
.iv-pix{color:var(--red);}
.iv-warn{color:var(--amber);}

/* ── Loading ── */
.loading-row{
  display:flex;align-items:center;gap:10px;
  padding:16px 0;color:var(--muted);font-size:13px;
}
.spinner{
  width:15px;height:15px;
  border:2px solid var(--border2);border-top-color:var(--accent);
  border-radius:50%;animation:spin 0.75s linear infinite;flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── State messages ── */
.state-msg{padding:10px 0;font-size:13px;}
.state-ok  {color:var(--green);}
.state-mute{color:var(--muted);}
.state-err {color:var(--red);}
.summary-text{
  font-size:13px;color:var(--muted);line-height:1.7;
  margin-bottom:14px;padding-bottom:14px;
  border-bottom:1px solid var(--border);
}

/* ── PDF subcards ── */
.pdf-subcard{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden;
}
.pdf-subcard:last-child{margin-bottom:0;}
.pdf-subcard-header{
  display:flex;align-items:center;gap:8px;padding:12px 14px;
  cursor:pointer;user-select:none;-webkit-user-select:none;
}
.pdf-subcard-header:active{background:var(--surface3);}
.pdf-icon-glyph{color:var(--amber);font-size:13px;flex-shrink:0;}
.pdf-filename{
  flex:1;font-size:13px;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  min-width:0;color:var(--text);
}
.pdf-chevron{font-size:10px;color:var(--hint);transition:transform 0.2s;flex-shrink:0;}
.pdf-chevron.open{transform:rotate(90deg);}
.pdf-subcard-body{display:none !important;border-top:1px solid var(--border);padding:14px;}
.pdf-subcard-body.open{display:block !important;}

/* ── History Icon & Panel ── */
.history-icon-btn{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;-webkit-appearance:none;flex-shrink:0;
  position:relative;
}
.history-icon-btn:active{background:rgba(26,26,26,0.12);}
.history-icon-btn svg{width:16px;height:16px;}

.history-panel{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;
  background:#000000;
  transform:translateX(100%);
  transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.history-panel.open{transform:translateX(0);}
.history-panel-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-top) + 18px) 24px 16px;
  border-bottom:1px solid var(--border);
}
.history-panel-title{
  font-family:'Lora',Georgia,serif;
  font-size:20px;font-weight:700;color:#1a1a1a;
}
.history-close-btn{
  width:36px;height:36px;border-radius:50%;
  background:rgba(26,26,26,0.06);border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#f2f2f0;font-size:18px;
  -webkit-appearance:none;
}
.history-close-btn:active{background:rgba(26,26,26,0.12);}
.history-panel-body{flex:1;overflow-y:auto;padding:16px 0 calc(var(--safe-bottom) + 16px);}
.history-empty{text-align:center;padding:60px 24px;color:var(--muted);font-size:14px;}

/* ── History ── */
.history-wrap{margin-top:28px;}
.history-label{
  font-size:11px;font-weight:600;letter-spacing:0.08em;
  text-transform:uppercase;color:#666660;
  margin-bottom:12px;padding:0 20px;
}
.history-entry{
  background:#ffffff;
  border:1px solid rgba(26,26,26,0.08);
  border-radius:var(--radius-sm);
  margin:0 20px 8px;
  overflow:hidden;
}
.history-entry-header{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;cursor:pointer;
  user-select:none;-webkit-user-select:none;
}
.history-entry-header:active{background:rgba(26,26,26,0.06);}
.history-entry-url{flex:1;font-size:13px;font-weight:600;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.history-entry-date{font-size:11px;color:#666660;flex-shrink:0;}
.history-entry-chevron{font-size:10px;color:rgba(26,26,26,0.4);transition:transform 0.2s;flex-shrink:0;}
.history-entry-chevron.open{transform:rotate(90deg);}
.history-entry-body{display:none;border-top:1px solid rgba(26,26,26,0.1);padding:12px 14px;}
.history-entry-body.open{display:block;}
.history-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.history-summary{font-size:12px;color:#666660;line-height:1.6;margin-bottom:10px;opacity:0.75;}
.history-actions{display:flex;gap:8px;}
.history-btn{
  font-size:12px;font-weight:600;padding:6px 12px;
  border-radius:6px;cursor:pointer;border:none;
  font-family:inherit;-webkit-appearance:none;
}
.history-btn-rescan{background:#1a1a1a;color:#ffffff;}
.history-btn-delete{background:rgba(191,53,48,0.1);color:#bf3530;}
.history-btn:active{opacity:0.8;}

.footer-brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
  margin-bottom:10px;
}
.footer-fixion{
  font-family:'Lora',Georgia,serif;
  font-weight:700;
  font-size:48px;
  color:#f2ead8;
  line-height:1;
}
.footer-by{
  font-size:11px;
  font-weight:700;
  letter-spacing:0.15em;
  text-transform:uppercase;
  color:rgba(242,234,216,0.4);
}
.pgcreate-logo{
  height:36px;
  width:auto;
  opacity:0.9;
}
.footer-lockup{height:80px;width:auto;margin-bottom:8px;display:block;margin-left:auto;margin-right:auto;}
.footer-powered{
  font-size:11px;
  color:rgba(242,234,216,0.25);
  letter-spacing:0.03em;
  margin:0;
}
/* ── Footer ── */
footer{
  text-align:center;
  padding:28px 24px calc(var(--safe-bottom) + 28px);
  border-top:1px solid rgba(26,26,26,0.08);
}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
</style>

<body>
<div id="app">
  <header>
    <div class="header-inner">
      <span class="wordmark-text">fixion</span>

    </div>
  </header>

  <!-- History Panel -->
  <div class="history-panel" id="history-panel">
    <div class="history-panel-header">
      <div style="width:36px;"></div>
      <span class="wordmark-text">fixion</span>
      <button class="history-close-btn" onclick="closeHistoryPanel()">×</button>
    </div>
    <div style="padding:16px 24px 4px;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);">Previous Scans</div>
    <div class="history-panel-body" id="history-panel-list"></div>
  </div>
  <main>
    <div class="hero">
      <h1 class="hero-title">Find it. Fix it.</h1>
      <p class="hero-sub">Grammar, spelling, broken links, pixelated images and PDF copy — checked across every page.</p>
    </div>

      <div class="input-section">
        <span class="input-label">Add website link</span>
        <div id="url-list">
          <div class="url-row">
            <input class="url-input" type="url" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="https://example.com" onkeydown="if(event.key==='Enter')startScan()"/>
            <button class="icon-btn" onclick="removeRow(this)">×</button>
          </div>
        </div>
      </div>
      <button id="scan-btn" onclick="startScan()">Scan</button>
      <div id="results-wrap" style="display:none;">
        <div id="proxy-bar" class="proxy-bar" style="margin:0 20px 12px;">
          <div class="proxy-dot" id="proxy-dot"></div>
          <span id="proxy-label">Connecting…</span>
        </div>
        <div class="results-label">Results</div>
        <div id="results" style="padding:0 20px;"></div>
      </div>

async function proxyFetch(url) {
  var order = [];
  for (var i = lastGoodProxy; i < PROXIES.length; i++) order.push(i);
  for (var i = 0; i < lastGoodProxy; i++) order.push(i);

  for (var idx = 0; idx < order.length; idx++) {
    var pi = order[idx];
    try {
      showProxyBar("trying", "Trying " + PROXIES[pi].name + "\u2026");
      var text = await PROXIES[pi].go(url);
      if (!text || text.trim().length < 50) throw new Error("empty");
      lastGoodProxy = pi;
      showProxyBar("ok", "Connected via " + PROXIES[pi].name);
      return text;
    } catch(e) {
      console.warn("[" + PROXIES[pi].name + "] failed:", e.message);
    }
  }
  showProxyBar("fail", "All proxies failed \u2014 site may block access");
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// UTILITIES
// ─────────────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function cid(s) {
  return "c" + Math.abs(s.split("").reduce(function(a,c) { return ((a<<5)-a)+c.charCodeAt(0)|0; }, 0));
}
function normUrl(base, href) {
  try {
    if (!href) return null;
    // Strip Chrome PDF viewer extension prefix
    var extMatch = href.match(/^chrome-extension:\/\/[^/]+\/(https?:\/\/.+)$/);
    if (extMatch) href = extMatch[1];
    if (/^(mailto:|tel:|javascript:|#$)/.test(href)) return null;
    return new URL(href, base).href;
  } catch(e) { return null; }
}
function parseJSON(raw) {
  var s = raw.indexOf("{"), e = raw.lastIndexOf("}");
  if (s === -1) return null;
  try { return JSON.parse(raw.slice(s, e + 1)); } catch(e) { return null; }
}

// ─────────────────────────────────────────────────────────────────────────────
// HTML EXTRACTION
// ─────────────────────────────────────────────────────────────────────────────
function sanitiseHtml(html) {
  // Strip Chrome PDF viewer extension prefix from all href attributes in raw HTML
  // e.g. href="chrome-extension://abc.../https://example.com/file.pdf"
  //   -> href="https://example.com/file.pdf"
  return html.replace(/chrome-extension:\/\/[a-z0-9]+\/(https?:\/\/)/gi, "$1");
}

function exText(html) {
  var d = document.createElement("div");
  d.innerHTML = html;

  // Remove only non-content elements — do NOT remove header/footer/aside
  // as many sites put their main copy inside these or adjacent to them.
  // We only strip scripts, styles, and purely decorative/invisible elements.
  d.querySelectorAll("script,style,noscript,iframe,svg,canvas").forEach(function(e) { e.remove(); });

  // Also strip nav menus and cookie banners which are noise, but keep their siblings
  d.querySelectorAll("nav,[role=navigation],[aria-label=navigation],cookie-banner,.cookie,.gdpr").forEach(function(e) { e.remove(); });

  // Walk the DOM and build text manually, inserting newlines at block boundaries
  // This works on detached nodes (unlike innerText which needs live DOM for layout)
  var INLINE = {a:1,abbr:1,acronym:1,b:1,bdo:1,big:1,br:1,button:1,cite:1,code:1,
    dfn:1,em:1,i:1,img:1,input:1,kbd:1,label:1,map:1,object:1,output:1,q:1,
    samp:1,select:1,small:1,span:1,strong:1,sub:1,sup:1,textarea:1,time:1,tt:1,var:1};
  function walkNode(node, buf) {
    if (node.nodeType === 3) { buf.push(node.nodeValue); return; }
    if (node.nodeType !== 1) return;
    var tag = node.tagName.toLowerCase();
    var isBlock = !INLINE[tag];
    if (isBlock) buf.push("\n");
    for (var i = 0; i < node.childNodes.length; i++) walkNode(node.childNodes[i], buf);
    if (isBlock) buf.push("\n");
  }
  var buf = [];
  walkNode(d, buf);
  var full = buf.join("").replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();

  // Deduplicate repeated whitespace lines (menus often repeat same words many times)
  var lines = full.split("\n");
  var seen = {};
  var deduped = [];
  lines.forEach(function(line) {
    var t = line.trim();
    if (!t) { deduped.push(""); return; }
    // Allow lines we have not seen before, or short lines (headings etc)
    if (!seen[t] || t.length < 30) {
      deduped.push(line);
      seen[t] = true;
    }
  });

  return deduped.join("\n").trim().slice(0, 6000);
}

function exSameOriginLinks(html, base) {
  var origin = new URL(base).origin;
  var d = document.createElement("div");
  d.innerHTML = html;
  var s = new Set();
  d.querySelectorAll("a[href]").forEach(function(a) {
    var n = normUrl(base, a.getAttribute("href"));
    if (!n) return;
    try {
      var u = new URL(n);
      if (u.origin === origin && !n.toLowerCase().includes(".pdf") && !n.includes("#")) {
        s.add(u.origin + u.pathname + u.search);
      }
    } catch(e) {}
  });
  return Array.from(s);
}

function exAllLinks(html, base) {
  var d = document.createElement("div");
  d.innerHTML = html;
  var s = new Set();
  d.querySelectorAll("a[href]").forEach(function(a) {
    var n = normUrl(base, a.getAttribute("href"));
    if (n && !n.toLowerCase().includes(".pdf")) s.add(n);
  });
  return Array.from(s).slice(0, 30);
}

function exImages(html, base) {
  var d = document.createElement("div");
  d.innerHTML = html;
  var imgs = [];
  d.querySelectorAll("img").forEach(function(img) {
    var src = img.getAttribute("src");
    if (!src || src.startsWith("data:")) return;
    var n = normUrl(base, src);
    if (!n) return;
    imgs.push({
      url: n,
      dW: parseInt(img.getAttribute("width") || "0"),
      dH: parseInt(img.getAttribute("height") || "0"),
      alt: img.getAttribute("alt") || ""
    });
  });
  return imgs.slice(0, 30);
}

function exPdfsFromPage(html, base) {
  var d = document.createElement("div");
  d.innerHTML = html;
  var map = new Map();
  d.querySelectorAll("a[href]").forEach(function(a) {
    var href = a.getAttribute("href") || "";

    // Strip Chrome PDF viewer extension prefix
    // e.g. chrome-extension://abc.../https://example.com/file.pdf
    var extMatch = href.match(/^chrome-extension:\/\/[^/]+\/(https?:\/\/.+)$/);
    if (extMatch) href = extMatch[1];

    if (!href.toLowerCase().includes(".pdf")) return;
    var n = normUrl(base, href);
    if (!n || map.has(n)) return;
    var label = a.textContent.trim() || n.split("/").pop().replace(/\.pdf$/i, "") || n;
    map.set(n, label);
  });
  return map;
}

async function crawlSite(entryUrl) {
  var origin   = new URL(entryUrl).origin;
  var visited  = new Set();
  var queue    = [entryUrl];
  var allPdfs  = new Map();
  var imgMap   = new Map();
  var linkMap  = new Map(); // url → page it was found on
  var allText  = "";
  var pageTexts = []; // [{url, text}]

  while (queue.length > 0 && visited.size < MAX_PAGES) {
    var pageUrl = queue.shift();
    if (visited.has(pageUrl)) continue;
    visited.add(pageUrl);

    var path = "/";
    try { path = new URL(pageUrl).pathname || "/"; } catch(e) {}
    updateCrawlStatus("Crawling page " + visited.size + ": " + path);

    var html = await proxyFetch(pageUrl);
    if (!html) continue;
    html = sanitiseHtml(html);

    var pageText = exText(html);
    if (allText.length < 8000) allText += " " + pageText;
    if (pageTexts.length < 8 && pageText.trim().length > 50) { var pt2 = pageText.trim().slice(0,6000); pt2 = pt2.slice(0, pt2.lastIndexOf(' ')+1) || pt2; pageTexts.push({ url: pageUrl, text: pt2 }); }

    exImages(html, pageUrl).forEach(function(img) {
      if (!imgMap.has(img.url)) imgMap.set(img.url, img);
    });

    exPdfsFromPage(html, pageUrl).forEach(function(label, url) {
      if (!allPdfs.has(url)) {
        console.log("PDF found:", url);
        allPdfs.set(url, label);
      }
    });


    exAllLinks(html, pageUrl).forEach(function(l) { if (!linkMap.has(l)) linkMap.set(l, pageUrl); });

    exSameOriginLinks(html, pageUrl).forEach(function(p) {
      if (!visited.has(p) && !queue.includes(p)) queue.push(p);
    });
  }

  return {
    pagesVisited: visited.size,
    text:   (function(t){ var s=t.trim().slice(0,8000); return s.slice(0,s.lastIndexOf(' ')+1)||s; })(allText),
    pageTexts: pageTexts,
    images: Array.from(imgMap.values()).slice(0, 30),
    pdfs:   Array.from(allPdfs.entries()).map(function(e) { return { url: e[0], label: e[1] }; }).slice(0, MAX_PDFS),
    links:  Array.from(linkMap.entries()).slice(0, 30).map(function(e) { return { url: e[0], foundOn: e[1] }; })
  };
}

// ─────────────────────────────────────────────────────────────────────────────
function chkPix(el, dW, dH) {
  var nw = el.naturalWidth, nh = el.naturalHeight;
  if (!nw || !nh) return { verdict: "unknown", detail: "Could not read dimensions" };
  var w = dW || el.width || nw;
  var h = dH || el.height || nh;
  var scale = Math.max(w / nw, h / nh);
  if (scale > 2.5) return { verdict: "pix",  detail: nw + "\xd7" + nh + "px \u2192 ~" + Math.round(w) + "\xd7" + Math.round(h) + "px (" + scale.toFixed(1) + "\xd7 upscale)" };
  if (scale > 1.4) return { verdict: "warn", detail: nw + "\xd7" + nh + "px \u2192 ~" + Math.round(w) + "\xd7" + Math.round(h) + "px (" + scale.toFixed(1) + "\xd7 \u2014 may look soft)" };
  return { verdict: "ok", detail: nw + "\xd7" + nh + "px \u2014 good resolution" };
}

function analyzeImages(imgData) {
  return new Promise(function(resolve) {
    var out = [], pending = imgData.length;
    if (!pending) { resolve([]); return; }
    imgData.forEach(function(item) {
      var img = new Image();
      img.crossOrigin = "anonymous";
      var timer = setTimeout(function() {
        out.push({ url: item.url, alt: item.alt, verdict: "unknown", detail: "Timed out" });
        if (!--pending) resolve(out);
      }, 6000);
      img.onload = function() {
        clearTimeout(timer);
        out.push(Object.assign({ url: item.url, alt: item.alt }, chkPix(img, item.dW, item.dH)));
        if (!--pending) resolve(out);
      };
      img.onerror = function() {
        clearTimeout(timer);
        out.push({ url: item.url, alt: item.alt, verdict: "unknown", detail: "Failed to load" });
        if (!--pending) resolve(out);
      };
      img.src = item.url;
    });
  });
}

async function chkLink(url) {
  try {
    var text = await proxyFetch(url);
    if (!text) return { url: url, status: "broken" };

    // Detect soft 404s — only flag if a strong 404 indicator appears near the top of the page
    // (within first 2000 chars) to avoid false positives from footer/nav text
    var top = text.slice(0, 2000).toLowerCase();
    var soft404 = (
      top.includes("page not found") ||
      top.includes("404 - ") ||
      top.includes("we couldn't find the page you were looking for") ||
      top.includes("we could not find the page you were looking for") ||
      top.includes("this page doesn't exist") ||
      top.includes("this page does not exist")
    );
    return { url: url, status: soft404 ? "broken" : "ok" };
  } catch(e) {
    return { url: url, status: "unknown" };
  }
}

// AI: TEXT ANALYSIS
// ─────────────────────────────────────────────────────────────────────────────
async function aiText(src, text) {
  // Sanitise extracted text before embedding in the prompt string —
  // raw page text can contain backslashes and newlines that corrupt JSON.stringify.
  // JSON.stringify wraps in quotes and escapes everything; we strip the outer quotes.
  var safeText = JSON.stringify(text).slice(1, -1);
  var safeSrc  = JSON.stringify(src).slice(1, -1);
  var prompt = TEXT_PROMPT_TEMPLATE
    .replace("SOURCE_PLACEHOLDER", safeSrc)
    .replace("TEXT_PLACEHOLDER", safeText);
  try {
    var headers = { "Content-Type": "application/json" };
    // When calling Anthropic directly (no worker), browser will be blocked by CORS.
    // The worker adds the API key and anthropic-version server-side.
    var res = await fetch(API_URL, {
      method: "POST",
      headers: headers,
      body: JSON.stringify({
        model: API_MODEL,
        max_tokens: 1500,
        messages: [{ role: "user", content: prompt }]
      })
    });
    var data = await res.json();

    // Surface API errors clearly
    if (data.error) {
      console.error("Claude API error:", data.error.type, data.error.message);
      return { issues: [], summary: "API error: " + data.error.message };
    }

    // Check for overloaded / stop_reason issues
    if (data.stop_reason === "max_tokens") {
      console.warn("aiText: hit max_tokens, response may be truncated");
    }

    var raw = (data.content || []).map(function(b) { return b.text || ""; }).join("");
    console.log("aiText raw response (" + raw.length + " chars):", raw.slice(0, 300));

    var parsed = parseJSON(raw);
    if (parsed) return parsed;

    // If we got text back but couldn't parse JSON, log it
    console.error("aiText: could not parse JSON from response:", raw.slice(0, 500));
    return { issues: [], summary: "Could not parse analysis response. Raw: " + raw.slice(0, 120) };
  } catch(e) {
    console.error("aiText fetch error:", e.message);
    return { issues: [], summary: "Request failed: " + e.message };
  }
}


// ─────────────────────────────────────────────────────────────────────────────
// AI: PDF ANALYSIS
// Attempt 1: pass URL directly to Claude via Worker (server-side fetch, no CORS)
// Attempt 2: fetch binary via proxy → base64 → Claude
// Attempt 3: proxy text strip fallback
// ─────────────────────────────────────────────────────────────────────────────

function arrayBufferToBase64(buffer) {
  var bytes = new Uint8Array(buffer);
  var chunks = [];
  for (var i = 0; i < bytes.length; i += 8192) {
    chunks.push(String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)));
  }
  return btoa(chunks.join(""));
}

async function fetchPdfBinary(pdfUrl) {
  var proxyUrls = [
    "https://corsproxy.io/?" + encodeURIComponent(pdfUrl),
    "https://api.cors.lol/?url=" + encodeURIComponent(pdfUrl),
    "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(pdfUrl),
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(pdfUrl)
  ];
  for (var i = 0; i < proxyUrls.length; i++) {
    try {
      var timeout = new Promise(function(_, rej) { setTimeout(function() { rej(new Error("timeout")); }, 20000); });
      var res = await Promise.race([fetch(proxyUrls[i]), timeout]);
      if (!res.ok) throw new Error("HTTP " + res.status);
      var buffer = await res.arrayBuffer();
      var bytes = new Uint8Array(buffer);
      if (bytes[0] === 0x25 && bytes[1] === 0x50 && bytes[2] === 0x44 && bytes[3] === 0x46) {
        console.log("fetchPdfBinary: valid PDF from proxy " + i + " (" + buffer.byteLength + " bytes)");
        return arrayBufferToBase64(buffer);
      }
      // allorigins /get wraps in JSON
      if (bytes[0] === 0x7B) {
        try {
          var json = JSON.parse(new TextDecoder().decode(buffer));
          if (json.contents && json.contents.startsWith("%PDF")) {
            return arrayBufferToBase64(new TextEncoder().encode(json.contents).buffer);
          }
          if (json.contents && json.contents.startsWith("data:application/pdf;base64,")) {
            return json.contents.split(",")[1];
          }
        } catch(e) {}
      }
      throw new Error("not PDF binary");
    } catch(e) {
      console.warn("fetchPdfBinary proxy " + i + " failed:", e.message);
    }
  }
  return null;
}

async function callClaude(messages) {
  var res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: API_MODEL, max_tokens: 1500, messages: messages })
  });
  if (res.status === 429) {
    var retryAfter = parseInt(res.headers.get("retry-after") || "30");
    throw new Error("rate_limit:" + retryAfter);
  }
  var data = await res.json();
  if (data.error) throw new Error(data.error.message);
  var raw = (data.content || []).map(function(b) { return b.text || ""; }).join("");
  return parseJSON(raw);
}

function sleep(ms) {
  return new Promise(function(resolve) { setTimeout(resolve, ms); });
}

function filterPdfIssues(issues) {
  return (issues || []).filter(function(issue) {
    var orig = (issue.original || "");
    var sugg = (issue.suggestion || "");
    var ctx  = (issue.context || "").toLowerCase();

    // Remove non-ASCII / high-byte originals
    if (/[^ -~]/.test(orig)) return false;

    // Remove standalone short artifacts
    if (orig.trim().length <= 2) return false;

    // Remove if context mentions encoding/ligature/artifact
    if (/ligature|replacement char|encoding|garbled|artifact/.test(ctx)) return false;

    // Remove pure f/i/l/a combos
    if (/^[fila]{2,6}$/.test(orig.trim())) return false;

    // Remove font dropout issues — suggestion is just original with letters added at start/end
    var origL = orig.replace(/[^a-zA-Z]/g, "").toLowerCase();
    var suggL = sugg.replace(/[^a-zA-Z]/g, "").toLowerCase();
    if (suggL.length > origL.length && (suggL.startsWith(origL) || suggL.endsWith(origL))) return false;

    // Remove if suggestion has more than 1 extra letter (dropped letters)
    if (origL.length > 0 && suggL.length > origL.length + 1) return false;

    // Remove if context mentions missing letters or truncation
    if (/missing.{0,20}(letter|end|'y'|tt|ff|fi|ft|ffl)|missing double|appears to be missing|truncat/.test(ctx)) return false;

    return true;
  });
}

function normaliseLigatures(text) {
  // Worker handles all ligature/broken-font substitutions server-side.
  // Client side: typography chars only.
  return text
    .replace(/’/g, "'").replace(/‘/g, "'")
    .replace(/“/g, '"').replace(/”/g, '"')
    .replace(/–/g, "-").replace(/—/g, "-")
    .replace(/…/g, "...").replace(/ /g, " ");
}

async function aiPdf(pdfUrl) {
  console.log("aiPdf:", pdfUrl);

  async function claudeWithRetry(messages) {
    for (var attempt = 0; attempt < 3; attempt++) {
      try { return await callClaude(messages); }
      catch(e) {
        var msg = e.message || "";
        if (msg.startsWith("rate_limit:")) {
          var secs = parseInt(msg.split(":")[1]) + 2;
          showProxyBar("trying", "Rate limited — waiting " + secs + "s…");
          await sleep(secs * 1000);
        } else { throw e; }
      }
    }
    return null;
  }

  // Strategy: ask Worker to extract text server-side (BT/ET operators, proper escaping)
  async function extractPdfText(url) {
    try {
      var res = await fetchWithTimeout(
        WORKER_URL + "?extract=1&url=" + encodeURIComponent(url),
        25000,
        { method: "POST" }
      );
      if (!res.ok) throw new Error("HTTP " + res.status);
      var data = await res.json();
      if (data.error) throw new Error(data.error);
      if (!data.text || data.text.length < 50) throw new Error("too short: " + (data.text || "").length);
      console.log("Worker extracted", data.chunks, "chunks,", data.text.length, "chars");
      return data.text;
    } catch(e) {
      console.warn("extractPdfText failed:", e.message);
      return null;
    }
  }

  // Attempt 1: extract raw text — catches silent dropout errors
  // Step 1: url-source scan — Claude reads PDF visually, catches wrong words & context errors
  var urlResults = null;
  try {
    showProxyBar("trying", "Scanning PDF for content errors…");
    urlResults = await claudeWithRetry([{ role:"user", content:[
      { type:"document", source:{ type:"url", url:pdfUrl } },
      { type:"text", text: PDF_PROMPT }
    ]}]);
    if (urlResults) console.log("PDF url-source ✓ —", (urlResults.issues||[]).length, "issues");
  } catch(e) { console.warn("url-source failed:", e.message); }

  await sleep(3000);

  // Step 2: raw text extraction — catches silent font dropout errors (missing tt/ff etc)
  var rawText = await extractPdfText(pdfUrl);
  var rawResults = null;
  if (rawText && rawText.length > 200) {
    try {
      var CHUNK_SIZE = 5000;
      var OVERLAP = 200;
      var chunks = [];
      for (var ci = 0; ci < rawText.length; ci += CHUNK_SIZE - OVERLAP) {
        chunks.push(rawText.slice(ci, ci + CHUNK_SIZE));
        if (ci + CHUNK_SIZE >= rawText.length) break;
      }
      console.log("Raw text scan:", chunks.length, "chunk(s),", rawText.length, "chars");

      var rawIssues = [], rawSummaries = [];
      for (var chunkIdx = 0; chunkIdx < chunks.length; chunkIdx++) {
        if (chunkIdx > 0) await sleep(4000);
        showProxyBar("trying", "Scanning PDF text — section " + (chunkIdx+1) + " of " + chunks.length + "…");
        var chunkPrompt = PDF_PROMPT + "\n\nPDF: " + pdfUrl + " (section " + (chunkIdx+1) + " of " + chunks.length + ")\n\n" + chunks[chunkIdx];
        try {
          var cr = await claudeWithRetry([{ role:"user", content: chunkPrompt }]);
          if (cr) {
            if (cr.issues) rawIssues = rawIssues.concat(cr.issues);
            if (cr.summary) rawSummaries.push(cr.summary);
          }
        } catch(e) { console.warn("Chunk", chunkIdx+1, "failed:", e.message); }
      }
      if (rawIssues.length || rawSummaries.length) {
        rawResults = {
          issues: rawIssues,
          summary: rawSummaries.find(function(s){ return s.indexOf("broken font") !== -1; }) || rawSummaries[0] || ""
        };
      }
    } catch(e) { console.warn("Raw text scan failed:", e.message); }
  }

  // Step 3: merge results — url-source catches wrong words, raw text catches font dropouts
  if (urlResults || rawResults) {
    var mergedIssues = [];
    var seen = {};
    // Add url-source issues first (higher quality context)
    ((urlResults && urlResults.issues) || []).forEach(function(issue) {
      var key = (issue.original || "").toLowerCase().trim();
      if (!seen[key]) { seen[key] = true; mergedIssues.push(issue); }
    });
    // Add raw text issues (font dropout errors not caught visually)
    ((rawResults && rawResults.issues) || []).forEach(function(issue) {
      var key = (issue.original || "").toLowerCase().trim();
      if (!seen[key]) { seen[key] = true; mergedIssues.push(issue); }
    });

    // Prefer broken-font summary, fall back to url-source summary
    var mergedSummary = (rawResults && rawResults.summary && rawResults.summary.indexOf("broken font") !== -1)
      ? rawResults.summary
      : (urlResults && urlResults.summary) || (rawResults && rawResults.summary) || "No issues found.";

    console.log("PDF merged scan done:", mergedIssues.length, "total issues");
    return { issues: mergedIssues, summary: mergedSummary };
  }

  return null;
}

// SCAN HISTORY (localStorage)
// ─────────────────────────────────────────────────────────────────────────────
var HISTORY_KEY = "fixion_scan_history";
var MAX_HISTORY = 50;

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); }
  catch(e) { return []; }
}

function saveHistory(history) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
  catch(e) { console.warn("Could not save history:", e); }
}

function addToHistory(url, scanData) {
  var history = loadHistory();
  var entry = {
    id:        Date.now(),
    url:       url,
    ts:        Date.now(),
    pages:     scanData.pagesVisited || 1,
    textIssues: (scanData.analysis && scanData.analysis.issues ? scanData.analysis.issues.length : 0),
    brokenLinks: (scanData.links || []).filter(function(l) { return l.status === "broken"; }).length,
    pixelated:  (scanData.images || []).filter(function(i) { return i.verdict === "pix"; }).length,
    pdfIssues:  (scanData.pdfs || []).reduce(function(a, p) { return a + filterPdfIssues(p.analysis && p.analysis.issues).length; }, 0),
    summary:   scanData.analysis && scanData.analysis.summary ? scanData.analysis.summary : "",
    // Store full scan data for viewing (compressed)
    data: {
      analysis: scanData.analysis,
      links:    (scanData.links || []).filter(function(l) { return l.status === "broken"; }),
      images:   (scanData.images || []).filter(function(i) { return i.verdict !== "unknown"; }),
      pdfs:     (scanData.pdfs || []).filter(function(p) { return p.state === "done"; }),
      pagesVisited: scanData.pagesVisited
    }
  };
  // Prepend new entry, keep max
  history.unshift(entry);
  if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
  saveHistory(history);
  renderHistory();
}

function deleteHistoryEntry(id) {
  var history = loadHistory().filter(function(e) { return e.id !== id; });
  saveHistory(history);
  renderHistory();
}

function rescanFromHistory(url) {
  var input = document.querySelector(".url-input");
  if (input) {
    input.value = url;
    startScan();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function toggleHistoryEntry(id) {
  var body = document.getElementById("hb-" + id);
  var chev = document.getElementById("hc-" + id);
  if (body) body.classList.toggle("open");
  if (chev) chev.classList.toggle("open");
}

function formatAge(ts) {
  var diff = Date.now() - ts;
  var mins = Math.floor(diff / 60000);
  var hrs  = Math.floor(diff / 3600000);
  var days = Math.floor(diff / 86400000);
  if (mins < 2)  return "just now";
  if (mins < 60) return mins + "m ago";
  if (hrs < 24)  return hrs + "h ago";
  if (days < 7)  return days + "d ago";
  return new Date(ts).toLocaleDateString("en-AU", { day:"numeric", month:"short" });
}

function openHistoryPanel() {
  renderHistoryPanel();
  document.getElementById("history-panel").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeHistoryPanel() {
  document.getElementById("history-panel").classList.remove("open");
  document.body.style.overflow = "";
}

function renderHistoryPanel() {
  var history = loadHistory();
  var list = document.getElementById("history-panel-list");
  if (!list) return;
  if (!history.length) {
    list.innerHTML = "<div class=\"history-empty\">No scans yet.<br>Run your first scan to see it here.</div>";
    return;
  }
  list.innerHTML = history.map(function(e) {
    var badges = "";
    if (e.textIssues)   badges += "<span class=\"badge b-warn\">" + e.textIssues + " text</span>";
    if (e.brokenLinks)  badges += "<span class=\"badge b-err\">" + e.brokenLinks + " broken</span>";
    if (e.pixelated)    badges += "<span class=\"badge b-err\">" + e.pixelated + " pix</span>";
    if (e.pdfIssues)    badges += "<span class=\"badge b-pdf\">" + e.pdfIssues + " PDF</span>";
    if (!e.textIssues && !e.brokenLinks && !e.pixelated && !e.pdfIssues)
      badges = "<span class=\"badge b-ok\">all clear</span>";

    var shortUrl = e.url.replace(/^https?:\/\//, "").replace(/\/$/, "");

    return "<div class=\"history-entry\">" +
      "<div class=\"history-entry-header\" onclick=\"toggleHistoryEntry(" + e.id + ")\">" +
        "<div style=\"flex:1;min-width:0;\">" +
          "<div class=\"history-entry-url\">" + esc(shortUrl) + "</div>" +
          "<div style=\"display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;\">" + badges + "</div>" +
        "</div>" +
        "<div class=\"history-entry-date\">" + formatAge(e.ts) + "</div>" +
        "<span class=\"history-entry-chevron\" id=\"hc-" + e.id + "\">►</span>" +
      "</div>" +
      "<div class=\"history-entry-body\" id=\"hb-" + e.id + "\">" +
        (e.summary ? "<div class=\"history-summary\">" + esc(e.summary.slice(0, 200)) + "</div>" : "") +
        "<div class=\"history-summary\">" + e.pages + " page" + (e.pages !== 1 ? "s" : "") + " crawled · " + formatAge(e.ts) + "</div>" +
        "<div class=\"history-actions\">" +
          "<button class=\"history-btn history-btn-rescan\" onclick=\"rescanFromHistory(" + JSON.stringify(e.url) + ")\">Rescan</button>" +
          "<button class=\"history-btn history-btn-delete\" onclick=\"deleteHistoryEntry(" + e.id + ")\">Delete</button>" +
        "</div>" +
      "</div>" +
    "</div>";
  }).join("");

}

// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
var S = {};
var GL = { spelling: "●", grammar: "○", punctuation: "◆", style: "□", "wrong-word": "⚠" };

// ─────────────────────────────────────────────────────────────────────────────
// BADGE BUILDER
// ─────────────────────────────────────────────────────────────────────────────
function buildBadges(state, r) {
  if (state === "scanning") return "<span class=\"badge b-scan\">scanning</span>";
  if (state === "error")    return "<span class=\"badge b-err\">error</span>";
  var iss = r.analysis && r.analysis.issues ? r.analysis.issues.length : 0;
  var brk = (r.links  || []).filter(function(l) { return l.status === "broken"; }).length;
  var pix = (r.images || []).filter(function(i) { return i.verdict === "pix"; }).length;
  var sft = (r.images || []).filter(function(i) { return i.verdict === "warn"; }).length;
  var pdf = (r.pdfs   || []).reduce(function(a, p) { return a + filterPdfIssues(p.analysis && p.analysis.issues).length; }, 0);
  if (!iss && !brk && !pix && !sft && !pdf) return "<span class=\"badge b-ok\">all clear</span>";
  var b = "";
  if (iss) b += "<span class=\"badge b-warn\">" + iss + " text</span>";
  if (brk) b += "<span class=\"badge b-err\">" + brk + " broken</span>";
  if (pix) b += "<span class=\"badge b-err\">" + pix + " pix</span>";
  else if (sft) b += "<span class=\"badge b-warn\">" + sft + " soft img" + (sft > 1 ? "s" : "") + "</span>";
  if (pdf) b += "<span class=\"badge b-pdf\">" + pdf + " PDF issue" + (pdf > 1 ? "s" : "") + "</span>";
  return b;
}

// ─────────────────────────────────────────────────────────────────────────────
// PDF TAB BUILDER
// ─────────────────────────────────────────────────────────────────────────────
function buildPdfTab(pdfs, id) {
  var out = "<div id=\"tp-" + id + "\" class=\"tab-panel\">";
  if (!pdfs.length) {
    out += "<div class=\"state-msg state-mute\">No PDF links found across the crawled pages.</div>";
  } else {
    out += "<div class=\"state-msg state-mute\" style=\"margin-bottom:10px;\">Tap ▶ Scan on each PDF to check it individually.</div>";
    for (var idx = 0; idx < pdfs.length; idx++) {
      var pdf = pdfs[idx];
      var pid = "p" + id + "x" + idx;
      var pi  = filterPdfIssues(pdf.analysis && pdf.analysis.issues);
      var pill;
      if (pdf.state === "scanning")                pill = "<span class=\"badge b-scan\">scanning…</span>";
      else if (pdf.state === "error")              pill = "<span class=\"badge b-err\">unreadable</span>";
      else if (pdf.state === "done" && !pi.length) pill = "<span class=\"badge b-ok\">Scanned</span>";
      else if (pdf.state === "done")               pill = "<span class=\"badge b-ok\">Scanned</span><span class=\"badge b-warn\" style=\"margin-left:4px;\">" + pi.length + " issue" + (pi.length > 1 ? "s" : "") + "</span>";
      else                                         pill = "<span class=\"badge b-gray\">not scanned</span>";

      var scanBtn = "";
      if (pdf.state === "ready" || pdf.state === "error") {
        scanBtn = "<button onclick=\"scanOnePdf(\'" + id + "\'," + idx + ");event.stopPropagation();\" style=\"background:#1a1a1a;color:#ffffff;border:1px solid #1a1a1a;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;flex-shrink:0;\">Scan</button>";
      }

      var pb = "";
      if (pdf.state === "scanning") {
        pb = "<div class=\"loading-row\"><div class=\"spinner\"></div>Reading PDF…</div>";
      } else if (pdf.state === "ready") {
        pb = "<div class=\"state-msg state-mute\">Click Scan to analyse this PDF for grammar and spelling issues.</div>";
      } else if (pdf.state === "error") {
        pb = "<div class=\"state-msg state-err\">Could not read this PDF.</div><div class=\"state-msg state-mute\" style=\"margin-top:4px;\">Try scanning again using the button above.</div>";
      } else if (pdf.state === "done") {
        if (pdf.analysis && pdf.analysis.summary) {
          var sumText = pdf.analysis.summary;
          var brokenFontMsg = "This PDF has broken font encoding which affects text searchability and accessibility.";
          if (sumText.indexOf(brokenFontMsg) === 0) sumText = brokenFontMsg;
          pb += "<div class=\"summary-text\">" + esc(sumText) + "</div>";
        }
        if (pi.length) {
          for (var j = 0; j < pi.length; j++) {
            var issue = pi[j];
            var pg = issue.page ? "<span class=\"page-tag\">p." + esc(issue.page) + "</span>" : "";
            var lt = issue.lang && issue.lang.toLowerCase() !== "english" ? "<span class=\"lang-tag\">" + esc(issue.lang) + "</span>" : "";
            pb += "<div class=\"issue-row\"><div class=\"issue-glyph\">" + (GL[issue.type] || "◎") + "</div><div class=\"issue-body\"><div><span class=\"issue-orig\">" + esc(issue.original) + "</span>" + pg + lt + "</div><div class=\"issue-fix\">→ " + esc(issue.suggestion) + "</div><div class=\"issue-why\">" + esc(issue.context) + "</div></div></div>";
          }
        } else {
          pb += "<div class=\"state-msg state-ok\">No issues found in this document.</div>";
        }
      }

      var isOpen = pdf.state === "scanning";
      out += "<div class=\"pdf-subcard\" id=\"sc-" + pid + "\">";
      out += "<div class=\"pdf-subcard-header\" onclick=\"togglePdf(\'" + pid + "\');\" style=\"gap:6px;\">";
      out += "<span class=\"pdf-filename\">" + esc(pdf.label) + "</span>";
      out += pill;
      out += scanBtn;
      out += "<span class=\"pdf-chevron" + (isOpen ? " open" : "") + "\" id=\"pc-" + pid + "\">►</span>";
      out += "</div>";
      out += "<div class=\"pdf-subcard-body" + (isOpen ? " open" : "") + "\" id=\"pb-" + pid + "\">" + pb + "</div>";
      out += "</div>";
    }
  }
  out += "</div>";
  return out;
}

// ─────────────────────────────────────────────────────────────────────────────
// BODY BUILDER
// ─────────────────────────────────────────────────────────────────────────────
function buildBody(r, id) {
  var iss  = r.analysis && r.analysis.issues ? r.analysis.issues : [];
  var imgs = r.images  || [];
  var lnks = r.links   || [];
  var pdfs = r.pdfs    || [];
  var pv   = r.pagesVisited || 1;
  var pdfTot = pdfs.reduce(function(a, p) { return a + filterPdfIssues(p.analysis && p.analysis.issues).length; }, 0);

  var h = "<div class=\"tab-strip\">" +
    "<button class=\"tab active\" onclick=\"swTab(this,\'tt-" + id + "\')\">Text (" + iss.length + ")</button>" +
    "<button class=\"tab\" onclick=\"swTab(this,\'tl-" + id + "\')\">Links (" + lnks.length + ")</button>" +
    "<button class=\"tab\" onclick=\"swTab(this,\'ti-" + id + "\')\">Images (" + imgs.length + ")</button>" +
    "<button class=\"tab\" onclick=\"swTab(this,\'tp-" + id + "\')\">PDFs (" + pdfs.length + (pdfTot ? " · " + pdfTot : "") + ")</button>" +
    "</div>" +
    "<div class=\"crawl-info\">" + pv + " page" + (pv !== 1 ? "s" : "") + " crawled · " + pdfs.length + " PDF" + (pdfs.length !== 1 ? "s" : "") + " found</div>";

  h += "<div id=\"tt-" + id + "\" class=\"tab-panel active\">";
  if (!iss.length) {
    h += "<div class=\"state-msg state-ok\">No text issues found.</div>";
  } else {
    if (r.analysis && r.analysis.summary) h += "<div class=\"summary-text\">" + esc(r.analysis.summary) + "</div>";
    if (iss.length) h += "<div class=\"summary-text\" style=\"font-size:11px;opacity:0.6;margin-bottom:8px;\">Note: highlighted text shows approximately where the error appears — check the suggestion for the correct spelling.</div>";
    iss.forEach(function(i) {
      var langTag = i.lang && i.lang.toLowerCase() !== "english" ? "<span class=\"lang-tag\">" + esc(i.lang) + "</span>" : "";
      var siteUrl = Object.keys(S).find(function(u) { return cid(u) === id; }) || "";
      var pageUrl = i.foundOn ? (siteUrl.replace(/\/$/, "") + i.foundOn) : "";
      var foundOnTag = i.foundOn ? "<a href=\"" + esc(pageUrl) + "\" target=\"_blank\" class=\"found-on-tag\">" + esc(i.foundOn) + " ↗</a>" : "";
      var sentenceRow = i.sentence ? "<div class=\"issue-sentence\">\u201c" + esc(i.sentence) + "\u201d</div>" : "";
      h += "<div class=\"issue-row\"><div class=\"issue-glyph\">" + (GL[i.type] || "◎") + "</div><div class=\"issue-body\"><div><span class=\"issue-orig\">" + esc(i.original) + "</span>" + langTag + foundOnTag + "</div><div class=\"issue-fix\">→ " + esc(i.suggestion) + "</div>" + sentenceRow + "<div class=\"issue-why\">" + esc(i.context) + "</div></div></div>";
    });
  }
  h += "</div>";

  h += "<div id=\"tl-" + id + "\" class=\"tab-panel\">";
  if (!lnks.length) { h += "<div class=\"state-msg state-mute\">No links found.</div>"; }
  else {
    lnks.forEach(function(l) {
      var cls = l.status === "ok" ? "lp-ok" : l.status === "broken" ? "lp-broken" : "lp-unknown";
      var lbl = l.status === "ok" ? "OK" : l.status === "broken" ? "BROKEN" : "?";
      var foundOn = l.foundOn ? l.foundOn.replace(/^https?:\/\/[^\/]+/, "") || "/" : "";
      h += "<div class=\"link-row\"><span class=\"link-pill " + cls + "\">" + lbl + "</span><div class=\"link-info\"><span class=\"link-href\">" + esc(l.url) + "</span>" + (foundOn ? "<span class=\"link-found-on\">Found on: " + esc(foundOn) + "</span>" : "") + "</div></div>";
    });
  }
  h += "</div>";

  h += "<div id=\"ti-" + id + "\" class=\"tab-panel\">";
  if (!imgs.length) { h += "<div class=\"state-msg state-mute\">No images analysed.</div>"; }
  else {
    imgs.forEach(function(img) {
      var verdictClass = img.verdict === "pix" ? "iv-pix" : img.verdict === "warn" ? "iv-warn" : "";
      var verdictText  = img.verdict === "pix" ? "Pixelated" : img.verdict === "warn" ? "Soft / Low-res" : "OK";
      h += "<div class=\"img-row\"><img class=\"img-thumb\" src=\"" + esc(img.url) + "\" loading=\"lazy\"/><div class=\"img-info\"><div class=\"img-name\">" + esc(img.url.split("/").pop() || img.url) + "</div><div class=\"img-dim\">" + esc(img.detail || "") + "</div><div class=\"img-verdict " + verdictClass + "\">" + verdictText + "</div></div></div>";
    });
  }
  h += "</div>";

  h += buildPdfTab(pdfs, id);

  return h;
}

// ─────────────────────────────────────────────────────────────────────────────
// CARD RENDERER
// ─────────────────────────────────────────────────────────────────────────────
function render(url, state) {
  var id   = cid(url);
  var r    = S[url] || {};
  var bdg  = buildBadges(state, r);
  var open = state === "scanning" || state === "done" || state === "error";
  var bh   = "";

  if (state === "scanning") {
    bh = "<div class=\"tab-strip\"><button class=\"tab active\" style=\"color:#0055cc;font-weight:600;\">● scanning</button></div>" +
         "<div class=\"tab-panel active\"><div class=\"loading-row\"><div class=\"spinner\"></div>" +
         "<span id=\"crawl-msg-" + id + "\">Crawling site pages…</span></div></div>";
  } else if (state === "error") {
    bh = "<div class=\"tab-panel active\" style=\"display:block;padding:14px 16px;\">" +
         "<div class=\"state-msg state-err\">Could not load this page — all proxies failed.</div>" +
         "<div class=\"state-msg state-mute\" style=\"margin-top:4px;\">Check the URL is correct and publicly accessible.</div></div>";
  } else if (state === "done") {
    bh = buildBody(r, id);

  }

  var ex = document.getElementById("card-" + id);
  if (ex) {
    ex.querySelector(".badge-row").innerHTML = bdg;
    var body = ex.querySelector(".site-card-body");
    var wasOpen      = body.classList.contains("open");
    var activeTab    = body.querySelector(".tab.active");
    var activePanelId = null;
    if (activeTab) {
      var m = (activeTab.getAttribute("onclick") || "").match(/swTab\(this,\'([^\']+)\'/);
      if (m) activePanelId = m[1];
    }
    var openPdfs = [];
    body.querySelectorAll(".pdf-subcard-body.open").forEach(function(el) { openPdfs.push(el.id); });

    body.innerHTML = bh;

    if (wasOpen || open) { body.classList.add("open"); ex.querySelector(".site-card-chevron").classList.add("open"); }

    if (activePanelId) {
      body.querySelectorAll(".tab").forEach(function(t) { t.classList.remove("active"); });
      body.querySelectorAll(".tab-panel").forEach(function(p) { p.classList.remove("active"); p.style.display = ""; });
      body.querySelectorAll(".tab").forEach(function(t) {
        if ((t.getAttribute("onclick") || "").indexOf(activePanelId) !== -1) t.classList.add("active");
      });
      var panel = document.getElementById(activePanelId);
      if (panel) { panel.classList.add("active"); panel.style.display = "block"; }
    }

    openPdfs.forEach(function(pbId) {
      var pb = document.getElementById(pbId);
      if (pb && pb.querySelector && pb.querySelector(".spinner")) {
        pb.classList.add("open");
        var pc = document.getElementById(pbId.replace("pb-", "pc-"));
        if (pc) pc.classList.add("open");
      }
    });
  } else {
    var card = document.createElement("div");
    card.className = "site-card";
    card.id = "card-" + id;
    card.innerHTML =
      "<div class=\"site-card-header\" onclick=\"toggleCard(\'" + id + "\');\">" +
        "<span class=\"site-card-chevron" + (open ? " open" : "") + "\">►</span>" +
        "<span class=\"site-card-url\">" + esc(url) + "</span>" +
        "<div class=\"badge-row\">" + bdg + "</div>" +
      "</div>" +
      "<div class=\"site-card-body" + (open ? " open" : "") + "\">" + bh + "</div>";
    document.getElementById("results").appendChild(card);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// UI TOGGLE HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function toggleCard(id) {
  var body = document.querySelector("#card-" + id + " .site-card-body");
  var chev = document.querySelector("#card-" + id + " .site-card-chevron");
  body.classList.toggle("open");
  chev.classList.toggle("open");
}

function togglePdf(pid) {
  var pb = document.getElementById("pb-" + pid);
  var pc = document.getElementById("pc-" + pid);
  if (pb) pb.classList.toggle("open");
  if (pc) pc.classList.toggle("open");
}

function swTab(btn, panelId) {
  var body = btn.closest(".site-card-body");
  if (!body) return;
  body.querySelectorAll(".tab-strip .tab").forEach(function(t) { t.classList.remove("active"); });
  body.querySelectorAll(".tab-panel").forEach(function(p) { p.classList.remove("active"); });
  btn.classList.add("active");
  var panel = document.getElementById(panelId);
  if (panel) { panel.classList.add("active"); panel.style.display = "block"; }
}

async function scanOnePdf(siteId, pdfIdx) {
  var siteUrl = null;
  for (var url in S) {
    if (cid(url) === siteId || cid(url) === String(siteId)) { siteUrl = url; break; }
  }
  if (!siteUrl || !S[siteUrl] || !S[siteUrl].pdfs) return;
  var pdfs = S[siteUrl].pdfs;
  if (!pdfs[pdfIdx]) return;

  pdfs[pdfIdx].state    = "scanning";
  pdfs[pdfIdx].analysis = null;
  S[siteUrl].pdfs = pdfs.map(function(p, i) {
    if (i !== pdfIdx && p.state === "scanning") return Object.assign({}, p, { state: "ready", analysis: null });
    return p;
  });
  render(siteUrl, "done");

  var pid = "p" + siteId + "x" + pdfIdx;
  var pb  = document.getElementById("pb-" + pid);
  var pc  = document.getElementById("pc-" + pid);
  if (pb) pb.classList.add("open");
  if (pc) pc.classList.add("open");

  showProxyBar("trying", "Scanning PDF: " + pdfs[pdfIdx].label);
  var result = await aiPdf(pdfs[pdfIdx].url);
  pdfs[pdfIdx].state    = result ? "done" : "error";
  pdfs[pdfIdx].analysis = result;
  S[siteUrl].pdfs = pdfs;
  render(siteUrl, "done");
  showProxyBar("ok", result ? "PDF scan complete" : "PDF could not be read");
}

// ─────────────────────────────────────────────────────────────────────────────
// MAIN SCAN
// ─────────────────────────────────────────────────────────────────────────────
async function startScan() {
  var urls = getUrls();
  if (!urls.length) return;
  var btn = document.getElementById("scan-btn");
  btn.disabled = true;
  btn.textContent = "Scanning…";
  document.getElementById("results").innerHTML = "";
  document.getElementById("results-wrap").style.display = "block";
  lastGoodProxy = 0;
  S = {};



  for (var ui = 0; ui < urls.length; ui++) {
    var url = urls[ui];
    render(url, "scanning");
    try {
      var crawl = await crawlSite(url);
      if (crawl.pagesVisited === 0) {
        S[url] = { error: true };
        render(url, "error");
        continue;
      }

      showProxyBar("trying", "Analysing text…");
      // Scan pages in parallel batches of 3 to speed things up
      var allIssues = [], allSummaries = [];
      var pagesToScan = crawl.pageTexts && crawl.pageTexts.length ? crawl.pageTexts : [{ url: url, text: crawl.text }];
      var BATCH = 3;
      showProxyBar("trying", "Analysing text across " + pagesToScan.length + " page" + (pagesToScan.length !== 1 ? "s" : "") + "…");

      for (var bi = 0; bi < pagesToScan.length; bi += BATCH) {
        var batch = pagesToScan.slice(bi, bi + BATCH).filter(function(pt) { return pt.text && pt.text.trim().length >= 20; });
        var batchResults = await Promise.all(batch.map(function(pt) {
          return aiText(pt.url, pt.text).then(function(pageAnalysis) {
            if (pageAnalysis && pageAnalysis.issues) {
              pageAnalysis.issues.forEach(function(issue) {
                issue.foundOn = pt.url.replace(/^https?:\/\/[^\/]+/, "") || "/";
              });
              return pageAnalysis;
            }
            return null;
          }).catch(function(e) { console.warn("aiText failed for", pt.url, e.message); return null; });
        }));
        batchResults.forEach(function(r) {
          if (!r) return;
          if (r.issues) allIssues = allIssues.concat(r.issues);
          if (r.summary) allSummaries.push(r.summary);
        });
      }

      // Deduplicate issues by original text
      var seenIssues = {};
      allIssues = allIssues.filter(function(i) {
        var key = (i.original || "").toLowerCase().trim();
        if (seenIssues[key]) return false;
        seenIssues[key] = true;
        return true;
      });
      var analysis = { issues: allIssues, summary: allSummaries[0] || "No issues found." };

      showProxyBar("trying", "Checking links…");
      showProxyBar("trying", "Checking " + crawl.links.length + " link" + (crawl.links.length !== 1 ? "s" : "") + "…");
      var linkResults = await Promise.all(crawl.links.map(function(linkObj) {
        return chkLink(linkObj.url).then(function(res) {
          res.foundOn = linkObj.foundOn;
          return res;
        }).catch(function() { return { url: linkObj.url, status: "broken", foundOn: linkObj.foundOn }; });
      }));

      showProxyBar("trying", "Analysing images…");
      var imgResults = await analyzeImages(crawl.images);

      var pdfsWithState = crawl.pdfs.map(function(p) {
        return { url: p.url, label: p.label, state: "ready", analysis: null };
      });

      S[url] = {
        analysis:     analysis,
        images:       imgResults,
        links:        linkResults,
        pdfs:         pdfsWithState,
        pagesVisited: crawl.pagesVisited
      };
      render(url, "done");
      addToHistory(url, S[url]);
      showProxyBar("ok", "Done — " + crawl.pagesVisited + " page" + (crawl.pagesVisited !== 1 ? "s" : "") + " scanned");

    } catch(e) {
      console.error("Scan error:", e);
      S[url] = { error: true };
      render(url, "error");
    }
  }

  btn.disabled = false;
  btn.textContent = "Scan again";
}


// ─────────────────────────────────────────────────────────────────────────────
// PDF REPORT GENERATOR
// ─────────────────────────────────────────────────────────────────────────────
function generateReport(url) {
  var r = S[url];
  if (!r) { alert("No scan data found for this URL."); return; }

  function runWithLib(jsPDFLib) {
    var doc = new jsPDFLib({ unit: "mm", format: "a4" });
    var W = 210, margin = 18, contentW = W - margin * 2;
    var y = 0;
    var BG_GREEN = [27, 74, 58];
    var CREAM    = [242, 234, 216];
    var MUTED    = [100, 100, 100];
    var RED      = [191, 53, 48];
    var AMBER    = [160, 92, 0];
    var GREEN_OK = [26, 110, 60];
    var BLUE     = [0, 85, 204];

    function setColor(arr) { doc.setTextColor(arr[0], arr[1], arr[2]); }
    function setFill(arr)  { doc.setFillColor(arr[0], arr[1], arr[2]); }
    function setDraw(arr)  { doc.setDrawColor(arr[0], arr[1], arr[2]); }

    function newPage() {
      doc.addPage();
      setFill(BG_GREEN); doc.rect(0, 0, W, 12, "F");
      doc.setFontSize(7); setColor(CREAM);
      doc.text("fixion  •  Scan Report", margin, 8);
      doc.text(url.replace(/^https?:\/\//, "").slice(0, 60), W - margin, 8, { align: "right" });
      y = 22;
    }

    function checkPage(needed) { if (y + needed > 272) newPage(); }

    function sectionTitle(title) {
      checkPage(14); y += 4;
      doc.setFontSize(8); doc.setFont(undefined, "bold"); setColor(BG_GREEN);
      doc.text(title.toUpperCase(), margin, y);
      y += 2; setDraw(BG_GREEN); doc.setLineWidth(0.3);
      doc.line(margin, y, margin + contentW, y);
      y += 7; doc.setFont(undefined, "normal");
    }

    function issueRow(original, suggestion, context, lang, type) {
      checkPage(24);
      var colours = { spelling: RED, grammar: AMBER, punctuation: BLUE, style: MUTED };
      var colour = colours[type] || MUTED;
      setFill(colour);
      doc.roundedRect(margin, y - 3.5, 22, 5.5, 1.5, 1.5, "F");
      doc.setFontSize(7); doc.setFont(undefined, "bold"); doc.setTextColor(255, 255, 255);
      doc.text((type || "issue").toUpperCase(), margin + 11, y + 0.3, { align: "center" });
      if (lang && lang.toLowerCase() !== "english") {
        doc.setFillColor(230, 240, 255);
        doc.roundedRect(margin + 24, y - 3.5, 20, 5.5, 1.5, 1.5, "F");
        doc.setTextColor(0, 60, 150);
        doc.text(lang.slice(0, 10), margin + 34, y + 0.3, { align: "center" });
      }
      y += 6;
      doc.setFontSize(9); setColor(RED); doc.setFont(undefined, "bold");
      var origLines = doc.splitTextToSize(original || "", contentW);
      doc.text(origLines, margin, y); y += origLines.length * 4.5;
      setColor(GREEN_OK); doc.setFont(undefined, "normal");
      var fixLines = doc.splitTextToSize("→ " + (suggestion || ""), contentW);
      doc.text(fixLines, margin, y); y += fixLines.length * 4.5;
      doc.setFontSize(8); setColor(MUTED);
      var ctxLines = doc.splitTextToSize(context || "", contentW);
      doc.text(ctxLines, margin, y); y += ctxLines.length * 4 + 4;
      setDraw([220, 220, 220]); doc.setLineWidth(0.15);
      doc.line(margin, y - 1, margin + contentW, y - 1);
    }

    // Cover page
    setFill(BG_GREEN); doc.rect(0, 0, W, 297, "F");
    doc.setFontSize(32); doc.setFont(undefined, "bold"); setColor(CREAM);
    doc.text("fixion", margin, 42);
    doc.setFontSize(12); doc.setFont(undefined, "normal");
    doc.text("Scan Report", margin, 52);
    setDraw(CREAM); doc.setLineWidth(0.25);
    doc.line(margin, 60, W - margin, 60);
    doc.setFontSize(12); doc.setFont(undefined, "bold"); setColor(CREAM);
    var urlLines = doc.splitTextToSize(url.replace(/^https?:\/\//, ""), contentW);
    doc.text(urlLines, margin, 72);
    doc.setFontSize(9); doc.setFont(undefined, "normal");
    doc.text("Generated " + new Date().toLocaleDateString("en-AU", { day:"numeric", month:"long", year:"numeric" }), margin, 72 + urlLines.length * 6 + 8);

    var issues = r.analysis && r.analysis.issues ? r.analysis.issues : [];
    var broken = (r.links || []).filter(function(l) { return l.status === "broken"; }).length;
    var pix    = (r.images || []).filter(function(i) { return i.verdict === "pix"; }).length;
    var pdfIss = (r.pdfs || []).reduce(function(a, p) { return a + filterPdfIssues(p.analysis && p.analysis.issues).length; }, 0);
    var pages  = r.pagesVisited || 1;

    var stats = [
      { label: "Pages crawled", val: String(pages) },
      { label: "Text issues",   val: String(issues.length) },
      { label: "Broken links",  val: String(broken) },
      { label: "Img issues",    val: String(pix) },
      { label: "PDF issues",    val: String(pdfIss) },
    ];
    var sy = 130;
    stats.forEach(function(s, i) {
      var col = (i % 2 === 0) ? margin : margin + contentW / 2 + 4;
      if (i > 0 && i % 2 === 0) sy += 24;
      doc.setFillColor(40, 90, 70);
      doc.roundedRect(col, sy, contentW / 2 - 4, 20, 3, 3, "F");
      doc.setFontSize(20); doc.setFont(undefined, "bold"); setColor(CREAM);
      doc.text(s.val, col + 9, sy + 13);
      doc.setFontSize(7); doc.setFont(undefined, "normal");
      doc.text(s.label, col + 9, sy + 18);
    });

    newPage();

    if (issues.length) {
      sectionTitle("Text Issues (" + issues.length + ")");
      if (r.analysis && r.analysis.summary) {
        doc.setFontSize(9); setColor(MUTED);
        var sl = doc.splitTextToSize(r.analysis.summary, contentW);
        doc.text(sl, margin, y); y += sl.length * 4.5 + 6;
      }
      issues.forEach(function(i) { issueRow(i.original, i.suggestion, i.context, i.lang, i.type); });
      y += 4;
    }

    var brkLinks = (r.links || []).filter(function(l) { return l.status === "broken"; });
    if (brkLinks.length) {
      sectionTitle("Broken Links (" + brkLinks.length + ")");
      brkLinks.forEach(function(l) {
        checkPage(10); doc.setFontSize(9); setColor(RED); doc.setFont(undefined, "normal");
        var ll = doc.splitTextToSize(l.url || "", contentW);
        doc.text(ll, margin, y); y += ll.length * 4.5 + 3;
      });
      y += 4;
    }

    var pixImgs = (r.images || []).filter(function(i) { return i.verdict === "pix" || i.verdict === "warn"; });
    if (pixImgs.length) {
      sectionTitle("Image Issues (" + pixImgs.length + ")");
      pixImgs.forEach(function(img) {
        checkPage(14);
        doc.setFontSize(9); setColor(img.verdict === "pix" ? RED : AMBER); doc.setFont(undefined, "bold");
        doc.text(img.verdict === "pix" ? "Pixelated" : "Low-res", margin, y);
        doc.setFont(undefined, "normal"); setColor(MUTED);
        var fn = (img.url || "").split("/").pop().slice(0, 60);
        var il = doc.splitTextToSize(fn, contentW - 22);
        doc.text(il, margin + 22, y); y += Math.max(il.length * 4.5, 5) + 4;
      });
      y += 4;
    }

    (r.pdfs || []).forEach(function(pdf) {
      var pi = filterPdfIssues(pdf.analysis && pdf.analysis.issues);
      if (!pi.length) return;
      var lbl = (pdf.label || (pdf.url || "").split("/").pop() || "PDF").slice(0, 50);
      sectionTitle("PDF: " + lbl);
      if (pdf.analysis && pdf.analysis.summary) {
        doc.setFontSize(9); setColor(MUTED);
        var ps = doc.splitTextToSize(pdf.analysis.summary, contentW);
        doc.text(ps, margin, y); y += ps.length * 4.5 + 6;
      }
      pi.forEach(function(i) { issueRow(i.original, i.suggestion, i.context, i.lang, i.type); });
      y += 4;
    });

    checkPage(10); setDraw(MUTED); doc.setLineWidth(0.15);
    doc.line(margin, y, margin + contentW, y); y += 5;
    doc.setFontSize(7); setColor(MUTED);
    doc.text("Generated by fixion • " + new Date().toLocaleString("en-AU"), margin, y);

    var domain = url.replace(/^https?:\/\//, "").replace(/[^a-z0-9]/gi, "-").slice(0, 40);
    doc.save("fixion-report-" + domain + ".pdf");
  }

  var jsPDFLib = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  if (jsPDFLib) {
    runWithLib(jsPDFLib);
  } else {
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload = function() {
      var lib = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
      if (lib) runWithLib(lib);
      else alert("Could not load PDF library.");
    };
    s.onerror = function() { alert("Could not load PDF library. Check your internet connection."); };
    document.head.appendChild(s);
  }
}
</script>
